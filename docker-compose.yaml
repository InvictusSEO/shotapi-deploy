version: '3.8'

services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CONCURRENT=5
      - QUEUED=10
      - TIMEOUT=30000
      - MAX_MEMORY_PERCENT=80
      - MAX_CPU_PERCENT=90
    shm_size: '1gb'
    volumes:
      - browserless-data:/app/data

volumes:
  browserless-data:

version: '3.8'

services:
  browser:
    image: appwrite/browser:latest
    container_name: docker-browser
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
